name: Docker Hub image

# Publishes a public image so anyone (or another machine) can run:
#   docker pull leobgs/leocinema-backend:latest
# Independent from pipeline.yaml, which builds for AWS (ECR + GitOps).
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: leobgs/leocinema-backend

jobs:
  publish:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short commit SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Use a Docker Hub access token (not the account password) as DOCKERHUB_PASSWORD.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # `latest` is for people who just want to try the app.
      # The SHA tag points to the exact commit that produced the image.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=dockerhub
          cache-to: type=gha,scope=dockerhub,mode=max
